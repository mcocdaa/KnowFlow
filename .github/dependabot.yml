version: 2
updates:
  # GitHub Actions 依赖（action 常以 major tag 发布，全部并入一个 PR）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # 前端 npm 依赖（仅 minor/patch 并入一个 PR；major 单独评估）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint peer 要求 typescript <6.1，暂不跟进 TS major
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # 后端 pip 依赖（仅 minor/patch 并入一个 PR；major 单独评估）
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pip-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Docker 基础镜像
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /.devcontainer
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  # gitsubmodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 4 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(submodule)'
