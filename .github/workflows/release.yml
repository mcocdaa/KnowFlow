name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release tag and package versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches backend and frontend versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME must be valid SemVer prefixed with v" >&2
            exit 1
          fi
          expected_version="${GITHUB_REF_NAME#v}"
          expected_base="${expected_version%%-*}"
          backend_version="$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          frontend_version="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('frontend/package.json').read_text(encoding='utf-8'))['version'])")"
          if [[ "$backend_version" != "$frontend_version" ]]; then
            echo "Version mismatch: backend=$backend_version frontend=$frontend_version" >&2
            exit 1
          fi
          if [[ "$expected_version" != "$backend_version" && "$expected_base" != "$backend_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$backend_version" >&2
            exit 1
          fi

  backend:
    name: Backend (ruff + pytest)
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.12.4

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (lint + test + build)
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Build OpenClaw plugin
        run: cd ../plugins/knowflow_openclaw/openclaw_plugin && npm ci && npm run build

  docker:
    name: Docker (${{ matrix.image }})
    needs: [validate-version, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate compose config
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f docker/docker-compose.base.yml config -q

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish GitHub Release
    needs: [validate-version, backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          fi
