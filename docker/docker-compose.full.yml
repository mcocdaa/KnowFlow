# ============================================
# KnowFlow 全栈模式（MongoDB + 后端 + 前端）
# 根目录 compose.yaml 已 include 本文件，可直接：
#   cp .env.example .env && docker compose up -d --build
# ============================================

services:
  backend:
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    networks:
      - knowflow-network
    depends_on:
      - backend

networks:
  knowflow-network:
    name: knowflow-network
