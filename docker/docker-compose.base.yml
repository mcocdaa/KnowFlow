# ============================================
# KnowFlow 基础服务（MongoDB + 后端）
# 组合方式：
#   根目录 compose.yaml        一键全栈：docker compose up -d --build
#   scripts/start.sh           分模式启动（dev/local）
# ============================================

services:
  mongodb:
    image: mongo:7
    container_name: knowflow-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - knowflow-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: knowflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - knowflow-data:/app/data
      - ../plugins:/app/plugins:ro
      # 可选：secrets/doubao_api_key.txt 存在时自动读取，无需额外配置
      - ../secrets:/secrets:ro
    environment:
      - API_VERSION=${API_VERSION:-v1}
      - DATA_DIR=${DATA_DIR:-./data}
      - UPLOAD_DIR=${UPLOAD_DIR:-./data/uploads}
      - PLUGINS_DIR=${PLUGINS_DIR:-./plugins}
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-knowflow}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DOUBAO_BASE_URL=${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-ep-20260304151850-xqxr9}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - knowflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  knowflow-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  knowflow-data:
    driver: local
