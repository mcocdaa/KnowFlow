# ============================================
# KnowFlow 前端服务
# 组合方式：
#   根目录 compose.yaml        一键全栈：docker compose up -d --build
#   scripts/start.sh           分模式启动（dev/local）
# ============================================

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    networks:
      - knowflow-network
    depends_on:
      - backend
