# ============================================
# KnowFlow 仅前端模式
# 使用: docker-compose -f docker-compose.frontend.yml -p knowflow up
# 注意：需要已有后端服务运行
# ============================================

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 浏览器侧同源请求 /api/v1，由 nginx 代理到后端（与 CSP connect-src 'self' 兼容）
        # 注意：VITE_API_BASE_URL 是构建期变量，必须在 build.args 传入，environment 对 vite build 无效
        VITE_API_BASE_URL: /api/v1
    container_name: knowflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      - VITE_API_BASE_URL=http://knowflow-backend:3000
    networks:
      - knowflow-network
    depends_on:
      - backend

networks:
  knowflow-network:
    name: knowflow-network
