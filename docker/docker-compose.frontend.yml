# ============================================
# KnowFlow 仅前端模式
# 使用: docker compose -p knowflow \
#         -f docker/docker-compose.base.yml \
#         -f docker/docker-compose.frontend.yml up -d
# 注意：需要已有后端服务运行
# ============================================

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: knowflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    networks:
      - knowflow-network
    depends_on:
      - backend

networks:
  knowflow-network:
    name: knowflow-network
