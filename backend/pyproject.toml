[project]
name = "knowflow-backend"
version = "1.2.0"
description = "KnowFlow Knowledge Management Platform Backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "KnowFlow Core Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymongo>=4.10.0,<5.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B904: API 层刻意用 HTTPException 做错误映射，原始异常已记录日志
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["B"]
"plugins/*" = []
