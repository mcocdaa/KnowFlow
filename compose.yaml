# ============================================
# KnowFlow 一键启动入口
#   git clone --recurse-submodules <repo> && cd KnowFlow
#   cp .env.example .env && vim .env
#   docker compose up -d --build
#
# 服务定义见 docker/（base = MongoDB + 后端，frontend = 前端）
# 分模式启动见 scripts/start.sh
# ============================================

include:
  - docker/docker-compose.base.yml
  - docker/docker-compose.frontend.yml
